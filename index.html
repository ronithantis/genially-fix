<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>משחקי בינה מלאכותית</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', 'Arial Hebrew', Arial, sans-serif; background: hsl(240 30% 97%); color: hsl(240 15% 12%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
.wrap { max-width: 560px; width: 100%; text-align: center; }
h1 { font-size: 1.9rem; font-weight: 800; color: hsl(262 80% 40%); margin-bottom: 0.4rem; }
p.sub { color: hsl(240 10% 45%); margin-bottom: 2rem; }
.cards { display: grid; gap: 1rem; }
a.card { display: flex; align-items: center; gap: 1rem; text-decoration: none; color: inherit; background: #fff; border: 2px solid hsl(240 15% 85%); border-radius: 1rem; padding: 1.25rem 1.5rem; transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s; text-align: right; }
a.card:hover { border-color: hsl(262 80% 55%); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
.icon { font-size: 2.2rem; }
.card h2 { font-size: 1.2rem; font-weight: 700; color: hsl(262 80% 40%); margin-bottom: 0.2rem; }
.card span { font-size: 0.9rem; color: hsl(240 10% 45%); }
</style>
</head>
<body>
<div class="wrap">
  <h1>🤖 משחקי בינה מלאכותית</h1>
  <p class="sub">בחרו משחק</p>
  <div class="cards">
    <a class="card" href="word-search/">
      <div class="icon">🔤</div>
      <div><h2>תפזורת בינה מלאכותית</h2><span>מצאו את המילים הקשורות לעולם ה-AI</span></div>
    </a>
    <a class="card" href="matching/">
      <div class="icon">🧩</div>
      <div><h2>משחק התאמת מושגים</h2><span>התאימו בין כל מושג להגדרה שלו</span></div>
    </a>
  </div>
</div>
</body>
</html>
